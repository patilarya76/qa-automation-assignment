[pytest]
minversion = 8.0
addopts = -v --strict-markers
python_files = test_*.py *_tests.py
python_classes = Test* *Tests
python_functions = test_*
testpaths = tests

markers =
    api: API automated tests using Requests & Pytest
    ui: UI automated tests using Selenium WebDriver & POM
    smoke: Quick sanity smoke test suite
